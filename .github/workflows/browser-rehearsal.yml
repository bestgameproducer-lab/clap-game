name: Browser rehearsal

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:e2e:review
      - name: Upload wedding review screenshot pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wedding-review-pack-${{ github.run_number }}
          path: artifacts/wedding-review-pack/
          if-no-files-found: warn
          retention-days: 30
