name: Browser rehearsal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply reviewed Codex audit patch
        if: github.event_name == 'pull_request'
        env:
          AUDIT_PATCH_B64: 
        run: |
          printf '%s' "$AUDIT_PATCH_B64" | base64 --decode > /tmp/codex-audit.patch
          git apply --index --whitespace=nowarn /tmp/codex-audit.patch
          git rm .github/workflows/apply-codex-audit.yml
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          git checkout FETCH_HEAD -- .github/workflows/browser-rehearsal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit wedding flow and harden registration"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:e2e:review
      - name: Upload wedding review screenshot pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wedding-review-pack-${{ github.run_number }}
          path: artifacts/wedding-review-pack/
          if-no-files-found: warn
          retention-days: 30
