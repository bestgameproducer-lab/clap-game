name: Codex one-time branch sync

on:
  push:
    branches:
      - codex/fix-preflight-image-latency
    paths:
      - .github/workflows/codex-one-time-sync.yml

permissions:
  contents: write

jobs:
  apply-tested-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-preflight-image-latency
          fetch-depth: 0
      - name: Apply tested local patch
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/codex.patch
          git apply --index /tmp/codex.patch
          git rm .github/workflows/codex-one-time-sync.yml
      - name: Commit synchronized files
        run: |
          git config user.name "codex-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close live wedding flow gaps"
          git push origin HEAD:codex/fix-preflight-image-latency
