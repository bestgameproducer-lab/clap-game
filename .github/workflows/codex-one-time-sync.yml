name: Codex One-Time Sync
on:
  push:
    branches:
      - codex/fix-preflight-image-latency
    paths:
      - .github/workflows/codex-one-time-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-preflight-image-latency
          fetch-depth: 0
      - name: Apply organizer symbol-side update
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/codex.patch
          git apply --index /tmp/codex.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ui: expose heart and star halves to organizers"
      - name: Remove one-time workflow and push
        run: |
          git rm .github/workflows/codex-one-time-sync.yml
          git commit -m "chore: remove one-time sync workflow"
          git push origin HEAD:codex/fix-preflight-image-latency
