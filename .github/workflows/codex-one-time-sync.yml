name: Codex One Time Sync
on:
  push:
    branches:
      - codex/fix-preflight-image-latency
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-preflight-image-latency
          fetch-depth: 0
      - name: Apply verified local patch
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/codex.patch
          git apply --index /tmp/codex.patch
          git rm .github/workflows/codex-one-time-sync.yml
          git config user.name codex-sync
          git config user.email codex-sync@users.noreply.github.com
          git commit -m "test secondary lucky ability in SQL runtime"
          git push origin HEAD:codex/fix-preflight-image-latency
